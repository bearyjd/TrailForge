services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data

  backend:
    image: ghcr.io/bearyjd/trailforge-backend:latest
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      - DATA_DIR=/data/jobs
    volumes:
      - job-data:/data/jobs
    depends_on:
      - redis

  worker:
    image: ghcr.io/bearyjd/trailforge-backend:latest
    build: ./backend
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      - DATA_DIR=/data/jobs
    volumes:
      - job-data:/data/jobs
    depends_on:
      - redis

  frontend:
    image: ghcr.io/bearyjd/trailforge-frontend:latest
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
    depends_on:
      - backend

volumes:
  redis-data:
  job-data:
